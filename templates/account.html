{% extends 'base.html' %}
{% block content %}
<div class="page-narrow"><div class="page-heading"><span class="eyebrow">YOUR ACCOUNT</span><h1>계정 관리</h1><p>{{ current_user['display_name'] }} · {{ '소유자' if current_user['role'] == 'owner' else '초대받은 사람' }}</p></div><form method="post" class="panel form-panel"><input type="hidden" name="_csrf" value="{{ csrf }}"><h2>비밀번호 변경</h2><label>현재 비밀번호<input type="password" name="old_password" autocomplete="current-password" required></label><label>새 비밀번호<input type="password" name="new_password" minlength="12" autocomplete="new-password" required></label><div class="form-actions"><button class="button primary" type="submit">비밀번호 변경</button></div></form></div>
{% endblock %}
